<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel Muller | M CORT'S</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23ef4444' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'%3E%3Ccircle cx='6' cy='6' r='3'/%3E%3Ccircle cx='6' cy='18' r='3'/%3E%3Cline x1='20' y1='4' x2='8.12' y2='15.88'/%3E%3Cline x1='14.47' y1='14.48' x2='20' y2='20'/%3E%3Cline x1='8.12' y1='8.12' x2='12' y2='12'/%3E%3C/svg%3E">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100vh;
      background-color: #0b0d12;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      padding: 20px;
    }

    .container {
      max-width: 780px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      margin-bottom: 24px;
      gap: 12px;
      flex-wrap: wrap;
    }

    h1 {
      font-size: 1.5rem;
      letter-spacing: 0.5px;
    }

    h1 span {
      color: #3b82f6;
    }

    .header-acoes {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn-site {
      background: #1d4ed8;
      color: #ffffff;
      text-decoration: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.88rem;
      font-weight: bold;
    }

    .btn-sair {
      background: rgba(255, 255, 255, 0.08);
      color: #e5e7eb;
      border: 1px solid rgba(255, 255, 255, 0.18);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-sair:hover {
      border-color: #ef4444;
      color: #fca5a5;
    }

    .login-box {
      max-width: 390px;
      margin: 48px auto;
      background: #131720;
      padding: 24px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      text-align: center;
    }

    .login-box p {
      color: #9ca3af;
      font-size: 0.9rem;
      margin-top: 8px;
      margin-bottom: 14px;
    }

    .login-box input {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: #0b0d12;
      color: #ffffff;
      font-size: 1rem;
    }

    .btn-primary {
      width: 100%;
      padding: 12px;
      background: #dc2626;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 0.95rem;
      cursor: pointer;
    }

    .btn-primary:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .aviso-status {
      margin-top: 12px;
      font-size: 0.85rem;
      color: #f87171;
      min-height: 20px;
    }

    .day-group {
      background: #131720;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 18px;
    }

    .day-title {
      color: #3b82f6;
      font-size: 1.15rem;
      font-weight: bold;
      margin-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 8px;
    }

    .booking-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      flex-wrap: wrap;
    }

    .booking-item:last-child {
      border-bottom: none;
    }

    .time-badge {
      background: #dc2626;
      color: #ffffff;
      font-weight: bold;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.88rem;
      display: inline-block;
      margin-right: 8px;
    }

    .client-meta {
      color: #9ca3af;
      font-size: 0.88rem;
      margin-top: 5px;
    }

    .item-actions {
      display: flex;
      gap: 8px;
    }

    .btn-wpp {
      background: #16a34a;
      color: #ffffff;
      text-decoration: none;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: bold;
    }

    .btn-del {
      background: rgba(239, 68, 68, 0.15);
      color: #ef4444;
      border: 1px solid #ef4444;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>M <span>CORT'S</span> • Agenda Muller</h1>
      <div class="header-acoes">
        <a href="index.html" class="btn-site">Voltar ao Site</a>
        <button type="button" class="btn-sair" id="btn-sair" style="display: none;">Sair</button>
      </div>
    </header>

    <form id="tela-login" class="login-box">
      <h2>Acesso Restrito</h2>
      <p>Entre com o e-mail e a senha cadastrados no Firebase para gerenciar a agenda.</p>
      <input type="email" id="email-input" placeholder="E-mail do Muller" autocomplete="username" required>
      <input type="password" id="senha-input" placeholder="Digite a senha" autocomplete="current-password" required>
      <button type="submit" class="btn-primary" id="btn-entrar">Entrar na Agenda</button>
      <div id="status-login" class="aviso-status"></div>
    </form>

    <div id="tela-agenda" style="display: none;">
      <p style="color: #9ca3af; margin-bottom: 16px; font-size: 0.9rem;">
        Atualização automática em tempo real. Ao liberar um horário, ele volta a ficar disponível no site.
      </p>
      <div id="lista-agendamentos">Carregando agendamentos...</div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCNwvebF9lGbE7dI1y9InZ3jInx7s1jsiI",
      authDomain: "m-corts-agendamento.firebaseapp.com",
      databaseURL: "https://m-corts-agendamento-default-rtdb.firebaseio.com",
      projectId: "m-corts-agendamento",
      storageBucket: "m-corts-agendamento.firebasestorage.app",
      messagingSenderId: "446464478587",
      appId: "1:446464478587:web:d322b1fc8e387f1503c1de"
    };

    const formLogin = document.getElementById("tela-login");
    const telaAgenda = document.getElementById("tela-agenda");
    const statusLogin = document.getElementById("status-login");
    const btnEntrar = document.getElementById("btn-entrar");
    const btnSair = document.getElementById("btn-sair");

    let db = null;
    let auth = null;
    let escutaAtiva = false;

    try {
      const app = initializeApp(firebaseConfig);
      db = getDatabase(app);
      auth = getAuth(app);
    } catch (err) {
      statusLogin.textContent = "Aviso: falha ao iniciar o Firebase (" + err.message + ").";
    }

    if (auth) {
      onAuthStateChanged(auth, (user) => {
        if (user) {
          formLogin.style.display = "none";
          telaAgenda.style.display = "block";
          btnSair.style.display = "inline-block";
          statusLogin.textContent = "";
          iniciarEscuta();
        } else {
          formLogin.style.display = "block";
          telaAgenda.style.display = "none";
          btnSair.style.display = "none";
        }
      });
    }

    formLogin.addEventListener("submit", async (e) => {
      e.preventDefault();
      if (!auth) {
        statusLogin.textContent = "Firebase Auth não inicializado.";
        return;
      }

      const email = document.getElementById("email-input").value.trim();
      const senha = document.getElementById("senha-input").value;

      btnEntrar.disabled = true;
      btnEntrar.textContent = "Entrando...";
      statusLogin.textContent = "";

      try {
        await signInWithEmailAndPassword(auth, email, senha);
        document.getElementById("senha-input").value = "";
      } catch (err) {
        statusLogin.textContent = "E-mail ou senha incorretos.";
      } finally {
        btnEntrar.disabled = false;
        btnEntrar.textContent = "Entrar na Agenda";
      }
    });

    btnSair.addEventListener("click", async () => {
      if (auth) {
        await signOut(auth);
      }
    });

    function iniciarEscuta() {
  if (escutaAtiva) return;
  escutaAtiva = true;

  const NOME_NEGOCIO = "M CORT'S"; // na Barber House: "Barber House"
  const container = document.getElementById("lista-agendamentos");

  const el = (tag, cls, texto) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (texto !== undefined) n.textContent = texto;
    return n;
  };
  const msgCard = (texto, cor) => {
    container.textContent = "";
    const card = el("div", "day-group");
    const p = el("p", "", texto);
    p.style.color = cor;
    card.appendChild(p);
    container.appendChild(card);
  };

  if (!db) {
    msgCard("Banco não conectado.", "#f87171");
    return;
  }

  const hoje = new Date();
  const hojeIso = `${hoje.getFullYear()}-${String(hoje.getMonth() + 1).padStart(2, "0")}-${String(hoje.getDate()).padStart(2, "0")}`;

  onValue(ref(db, "agendamentos"), (snapshot) => {
    const dados = snapshot.val() || {};
    container.textContent = "";

    const datas = Object.keys(dados).filter((d) => d >= hojeIso).sort();
    if (datas.length === 0) {
      msgCard("Nenhum agendamento a partir de hoje.", "#9ca3af");
      return;
    }

    datas.forEach((dataIso) => {
      const [ano, mes, dia] = dataIso.split("-");
      const horariosObj = dados[dataIso] || {};

      const cardDia = el("div", "day-group");
      cardDia.appendChild(el("div", "day-title", `Data: ${dia}/${mes}/${ano}`));

      Object.keys(horariosObj).sort().forEach((hora) => {
        const item = horariosObj[hora];
        if (!item) return;

        const telLimpo = String(item.whatsapp || "").replace(/\D/g, "");
        const telWpp = telLimpo.startsWith("55") ? telLimpo : `55${telLimpo}`;
        const msg = encodeURIComponent(
          `Olá ${item.nome || "cliente"}, aqui é da ${NOME_NEGOCIO}. Confirmando seu horário dia ${dia}/${mes} às ${hora} (${item.servico || "Atendimento"}).`
        );

        const row = el("div", "booking-item");

        const esquerda = el("div");
        esquerda.appendChild(el("span", "time-badge", hora));
        esquerda.appendChild(el("strong", "", item.nome || "Cliente"));
        esquerda.appendChild(el("div", "client-meta", `${item.servico || ""} • WhatsApp: ${item.whatsapp || "-"}`));

        const acoes = el("div", "item-actions");
        const link = el("a", "btn-wpp", "WhatsApp");
        link.href = `https://wa.me/${telWpp}?text=${msg}`;
        link.target = "_blank";
        link.rel = "noopener";

        const btnDel = el("button", "btn-del", "Liberar Horário");
        btnDel.type = "button";
        btnDel.addEventListener("click", async () => {
          if (!confirm(`Liberar o horário ${hora} do dia ${dia}/${mes} (${item.nome || "cliente"})?`)) return;
          try {
            await update(ref(db), {
              [`agendamentos/${dataIso}/${hora}`]: null,
              [`ocupados/${dataIso}/${hora}`]: null
            });
          } catch (e) {
            alert("Não foi possível liberar o horário. Verifique se você está logado.");
          }
        });

        acoes.append(link, btnDel);
        row.append(esquerda, acoes);
        cardDia.appendChild(row);
      });

      container.appendChild(cardDia);
    });
  }, () => {
    msgCard("Erro ao ler os agendamentos. Saia e entre de novo.", "#f87171");
  });
}
  </script>
</body>
</html>
